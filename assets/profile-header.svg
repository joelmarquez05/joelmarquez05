  <title id="title">Joel Márquez Álvarez — Data, systems and human impact</title>
  <desc id="description">An editorial cream and forest-green banner inspired by Joel's profile photo. A branching data network grows into leaves beside his name. BSc in Data Science and Engineering, in progress at UPC, Barcelona.</desc>
